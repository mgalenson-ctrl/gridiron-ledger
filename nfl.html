  const res=(r.home_score-r.away_score)-r.spread; if(res===0) return ' <span class="muted mono">ATS push</span>';
  const ok = (r.pred_margin>r.spread)===(res>0); return ` <span class="mono ${ok?'ok':'miss'}">ATS ${ok?'✓':'✗'}</span>`; }
function atsRecord(rows){ let w=0,l=0,fw=0,fl=0;
  rows.forEach(r=>{ if(r.spread==null||r.spread===0||r.pred_margin==null||r.pred_margin===r.spread) return; const res=(r.home_score-r.away_score)-r.spread; if(res===0) return;
    ((r.pred_margin>r.spread)===(res>0))?w++:l++; ((r.spread>0)===(res>0))?fw++:fl++; });
  return {w,l,fw,fl}; }
function atsTable(){ const A=B.ats_metrics; if(!A) return '';
  const f=v=>v==null?'—':(v*100).toFixed(1)+'%', cls=v=>v!=null&&v>=A.break_even?'better':'';
  return `<h2>Against the spread</h2>
  <p>How often each approach covered the betting spread in walk-forward testing (pushes excluded). At standard −110 odds you need ${f(A.break_even)} just to break even. Numbers near 50% mean no edge over the line.</p>
  <div class="tscroll"><table><thead><tr><th>Season</th><th>Games</th><th>Model's spread pick</th><th>Model's winner pick</th><th>Vegas favorite</th></tr></thead><tbody>
  ${Object.entries(A.by_season).map(([s,v])=>`<tr><td>${s}</td><td>${v.n}</td><td class="${cls(v.model_side)}">${f(v.model_side)}</td><td>${f(v.winner_pick)}</td><td>${f(v.favorite)}</td></tr>`).join('')}
  <tr><td><b>All</b></td><td><b>${A.all.n}</b></td><td class="${cls(A.all.model_side)}"><b>${f(A.all.model_side)}</b></td><td><b>${f(A.all.winner_pick)}</b></td><td><b>${f(A.all.favorite)}</b></td></tr></tbody></table></div>
  <p class="mono muted">Model's spread pick = the side its projected margin favors against the line. Winner pick = the team it picks to win, judged against the spread.</p>`; }
/* ---------- value check ---------- */
const oddsTxt = o => o==null?'—':(o>0?'+'+Math.round(o):''+Math.round(o));
const edgeTxt = e => (e>=0?'+':'')+(e*100).toFixed(1)+' pts';
function valueBlock(g){ const v=g.value; if(!v||(!v.moneyline&&!v.spread&&!v.total)) return '';
  const row=(kind,x,label)=>`<tr><td>${kind}</td><td>${esc(label)}</td><td>${oddsTxt(x.odds)}${x.odds_assumed?'*':''}</td><td>${pct(x.p)}</td><td>${pct(x.break_even)}</td><td class="${x.edge>0?'better':''}">${edgeTxt(x.edge)}</td></tr>`;
  let h=`<p style="margin:6px 0 4px"><b>Value check</b></p><div class="tscroll"><table><thead><tr><th>Bet</th><th>Pick</th><th>Odds</th><th>Model</th><th>Need</th><th>Edge</th></tr></thead><tbody>`;
  if(v.moneyline) h+=row('Moneyline', v.moneyline, v.moneyline.pick);
  if(v.spread) h+=row('Spread', v.spread, `${v.spread.pick} ${lnTxt(v.spread.line)}`);
  h+=`</tbody></table></div>`;
  h+=totalBlock(v.total);
  if(v.spread&&v.spread.odds_assumed) h+=`<p class="mono muted" style="margin:2px 0">*Spread price not posted; standard −110 assumed.</p>`;
  if(v.alt&&v.alt.length) h+=`<details style="margin:6px 0"><summary style="cursor:pointer">Alternate spreads (${esc(v.alt[0].team)})</summary><div class="tscroll"><table><thead><tr><th>Line</th><th>Model cover chance</th><th>Fair odds</th></tr></thead><tbody>${v.alt.map(a=>`<tr><td>${esc(a.team)} ${lnTxt(a.line)}</td><td>${pct(a.p)}</td><td>${oddsTxt(a.fair_odds)}</td></tr>`).join('')}</tbody></table></div><p class="mono muted" style="margin:2px 0">Fair odds = the price at which the model sees no edge. A sportsbook price better than this is where an edge would be. Alternate-line prices are not in the free data feed, so compare against your book.</p></details>`;
  const EV=B.edge_validation; h+=`<p class="muted" style="margin:4px 0 0;font-size:13px">Need = break-even chance at those odds. Edge = model chance minus need. In past seasons these estimates did not reliably turn into profit${EV&&EV.moneyline?` (moneyline picks with a 2+ pt edge returned ${(EV.moneyline[1].roi*100).toFixed(1)}% per bet)`:''}; treat them as a gauge, not a signal.</p>`;
  return h; }
function edgeRecord(){ const E=B.edge_validation; if(!E) return '';
  const f=v=>v==null?'—':(v*100).toFixed(1)+'%';
  let h=`<h2>Do the edge estimates hold up?</h2><p>Each check uses only information available before the games it scores (seasons ${E.seasons_scored.join(', ')}).</p>
  <h3>Cover chances at the main line and alternate lines</h3>
  <p>Brier score ${E.alt_lines.brier.toFixed(4)} vs ${E.alt_lines.brier_coinflip.toFixed(4)} for a coin flip across ${E.alt_lines.n.toLocaleString()} line checks (lines moved by 0, ±3, ±3.5 and ±7 points). Lower is better.</p>
  <div class="tscroll"><table><thead><tr><th>Model said</th><th>Checks</th><th>Predicted</th><th>Covered</th></tr></thead><tbody>${E.alt_lines.calibration.map(c=>`<tr><td>${pct(c.lo)}–${pct(c.hi)}</td><td>${c.n}</td><td>${pct(c.pred)}</td><td>${pct(c.actual)} <span class="muted mono">(${wilson(c.actual,c.n)})</span></td></tr>`).join('')}</tbody></table></div>
  <h3>Main-line spread picks by model confidence</h3>
  <div class="tscroll"><table><thead><tr><th>Model cover chance</th><th>Games</th><th>Actually covered</th></tr></thead><tbody>${E.main_line.map(m=>`<tr><td>${pct(m.min_p)} or more</td><td>${m.n}</td><td class="${m.cover_rate!=null&&m.cover_rate>=E.break_even_110?'better':''}">${f(m.cover_rate)} <span class="muted mono">(${wilson(m.cover_rate||0,m.n)})</span></td></tr>`).join('')}</tbody></table></div>
  <p class="mono muted">Break-even at −110 is ${f(E.break_even_110)}. Small groups swing a lot; a result above break-even on a few hundred games can still be luck.</p>`;
  if(E.moneyline) h+=`<h3>Moneyline picks by estimated edge</h3><div class="tscroll"><table><thead><tr><th>Estimated edge</th><th>Bets</th><th>Won</th><th>Return per $1</th></tr></thead><tbody>${E.moneyline.map(m=>`<tr><td>over ${(m.min_edge*100).toFixed(0)} pts</td><td>${m.bets}</td><td>${f(m.win_rate)}</td><td class="${m.roi>0?'better':''}">${(m.roi>=0?'+':'')+(m.roi*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div><p class="mono muted">Past moneylines are closing prices, the same prices the model saw, which is why estimated edges are small.</p>`;
  return h; }
/* ---------- totals, closing-line value, confidence ranges ---------- */
const wilson=(p,n)=>{ if(!n) return ''; const z=1.96, d=1+z*z/n, c=(p+z*z/(2*n))/d, h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d; return `${Math.round(Math.max(0,c-h)*100)}–${Math.round(Math.min(1,c+h)*100)}%`; };
function ouChip(g){ return g.ou?`<span class="chip">Total pick: ${g.ou.pick} ${g.ou.line}</span>`:''; }
function ouMark(r){ if(r.total_line==null||r.pred_total==null||r.pred_total===r.total_line) return ''; const t=r.home_score+r.away_score; if(t===r.total_line) return ' <span class="muted mono">O/U push</span>';
  const ok=(r.pred_total>r.total_line)===(t>r.total_line); return ` <span class="mono ${ok?'ok':'miss'}">O/U ${ok?'✓':'✗'}</span>`; }
function ouRecord(rows){ let w=0,l=0,o=0,n=0; rows.forEach(r=>{ if(r.total_line==null||r.pred_total==null||r.pred_total===r.total_line) return; const t=r.home_score+r.away_score; if(t===r.total_line) return;
  ((r.pred_total>r.total_line)===(t>r.total_line))?w++:l++; if(t>r.total_line) o++; n++; }); return {w,l,o,n}; }
function totalBlock(t){ if(!t) return '';
  let h=`<p style="margin:8px 0 4px"><b>Total</b>: projected ${t.proj} points (80% range ${t.range80[0]}–${t.range80[1]}) vs posted ${t.line}.</p>`;
  h+=`<div class="tscroll"><table><thead><tr><th>Bet</th><th>Pick</th><th>Odds</th><th>Model</th><th>Need</th><th>Edge</th></tr></thead><tbody><tr><td>Total</td><td>${t.pick} ${t.line}</td><td>${oddsTxt(t.odds)}${t.odds_assumed?'*':''}</td><td>${pct(t.p)}</td><td>${pct(t.break_even)}</td><td class="${t.edge>0?'better':''}">${edgeTxt(t.edge)}</td></tr></tbody></table></div>`;
  if(t.odds_assumed) h+=`<p class="mono muted" style="margin:2px 0">*Total price not posted; standard −110 assumed.</p>`;
  if(t.alt&&t.alt.length) h+=`<details style="margin:6px 0"><summary style="cursor:pointer">Alternate totals</summary><div class="tscroll"><table><thead><tr><th>Line</th><th>Over chance</th><th>Fair over</th><th>Fair under</th></tr></thead><tbody>${t.alt.map(a=>`<tr><td>${a.line}</td><td>${pct(a.over)}</td><td>${oddsTxt(a.fair_over)}</td><td>${oddsTxt(a.fair_under)}</td></tr>`).join('')}</tbody></table></div></details>`;
  return h; }
function clvTiles(){ const C=B.clv; if(!C) return ''; const t=(k,lab)=>{ const c=C[k]; return `<div class="tile"><div class="k">${lab}</div><div class="v">${c.n?`${c.toward}–${c.away}`:'—'}</div><div class="s">${c.n?`line moved toward vs away from the model's first pick${c.unchanged?`, ${c.unchanged} unchanged`:''}; avg ${(c.avg_pts>=0?'+':'')+c.avg_pts.toFixed(1)} pts`:'builds up as this season’s games finish'}</div></div>`; };
  return t('spread','Closing line: spreads')+t('total','Closing line: totals'); }
function totalsRecord(){ const V=B.totals_validation; if(!V) return ''; const f=v=>v==null?'—':(v*100).toFixed(1)+'%';
  return `<h2>Totals (over/under)</h2>
  <p>Projected total vs the posted total, walk-forward. Average miss: model ${V.mae_model.toFixed(1)} points, posted total ${V.mae_line.toFixed(1)}. Break-even at −110 is 52.4%.</p>
  <div class="tscroll"><table><thead><tr><th>Season</th><th>Games</th><th>Model's side right</th><th>Overs hit</th></tr></thead><tbody>
  ${Object.entries(V.record.by_season).map(([s,v])=>`<tr><td>${s}</td><td>${v.n}</td><td class="${v.model_side>=0.5238?'better':''}">${f(v.model_side)} <span class="muted mono">(${wilson(v.model_side,v.n)})</span></td><td>${f(v.over_rate)}</td></tr>`).join('')}
  <tr><td><b>All</b></td><td><b>${V.record.all.n}</b></td><td><b>${f(V.record.all.model_side)}</b> <span class="muted mono">(${wilson(V.record.all.model_side,V.record.all.n)})</span></td><td><b>${f(V.record.all.over_rate)}</b></td></tr></tbody></table></div>
  <h3>Over chances at the posted and alternate totals</h3>
  <p>Brier ${V.brier.toFixed(4)} vs ${V.brier_coinflip.toFixed(4)} for a coin flip, across ${V.line_checks.toLocaleString()} checks (seasons ${V.seasons_scored.join(', ')}).</p>
  <div class="tscroll"><table><thead><tr><th>Model said</th><th>Checks</th><th>Predicted</th><th>Went over (95% range)</th></tr></thead><tbody>${V.calibration.map(c=>`<tr><td>${pct(c.lo)}–${pct(c.hi)}</td><td>${c.n}</td><td>${pct(c.pred)}</td><td>${pct(c.actual)} <span class="muted mono">(${wilson(c.actual,c.n)})</span></td></tr>`).join('')}</tbody></table></div>
  <div class="tscroll"><table><thead><tr><th>Model chance on its side</th><th>Games</th><th>Hit (95% range)</th></tr></thead><tbody>${V.main_line.map(m=>`<tr><td>${pct(m.min_p)} or more</td><td>${m.n}</td><td class="${m.hit_rate!=null&&m.hit_rate>=0.5238?'better':''}">${f(m.hit_rate)} <span class="muted mono">(${wilson(m.hit_rate||0,m.n)})</span></td></tr>`).join('')}</tbody></table></div>
  <p class="mono muted">The 95% range is where the true rate plausibly sits given the sample size. If it includes 52.4%, the result can't be told apart from break-even.</p>`; }
/* ---------- completed games ---------- */
const resMark = f => f.ungraded?'':(f.correct===true?'✅':(f.correct===false?'❌':'➖'));
function finalChip(g){ const f=g.final; if(!f) return g.live_state?`<span class="chip warn">Live${g.live_state.away_score!=null?`: ${g.away} ${g.live_state.away_score} – ${g.home} ${g.live_state.home_score}`:''}${g.live_state.detail?` · ${esc(g.live_state.detail)}`:''}</span>`:'';
  const x=[]; if(f.ats_correct!=null) x.push(`spread ${f.ats_correct?'✓':'✗'}`); if(f.ou_correct!=null) x.push(`total ${f.ou_correct?'✓':'✗'}`);
  return `<span class="chip final">Final: ${g.away} ${f.away_score} – ${g.home} ${f.home_score}</span>${x.length?`<span class="chip">${x.join(' · ')}</span>`:''}`; }
function weekRecord(){ const fs=B.games.map(g=>g.final).filter(f=>f&&f.correct!=null); if(!fs.length) return ''; const w=fs.filter(f=>f.correct).length; return `<span>· this week ${w}–${fs.length-w}</span>`; }
function archiveBlock(){ const A=(B.archive||[]); if(!A.length) return '';
  const byW={}; A.forEach(a=>{ (byW[a.week] ||= []).push(a); });
  return `<details class="arch"><summary>Earlier weeks (${A.length} game${A.length===1?"":"s"}, picks as locked at kickoff)</summary>${Object.keys(byW).sort((a,b)=>b-a).map(w=>{ const r=byW[w], c=r.filter(a=>a.correct===true).length, n=r.filter(a=>a.correct!=null).length;
    return `<div class="day">Week ${w} · ${c}–${n-c}</div>${r.map(a=>`<div class="res done" data-teams="${esc(teamKey(a.home,a.away))}"><span>${resMark(a)}</span><span>${esc(a.pick)} ${pct(a.p_pick)} <span class="muted">· final ${esc(a.away)} ${a.away_score} – ${esc(a.home)} ${a.home_score}${a.proj&&a.proj[0]!=null?` · proj ${a.proj[0]}–${a.proj[1]}`:''}</span></span><span class="mono muted">${a.ats_correct!=null?`ATS ${a.ats_correct?'✓':'✗'}`:''}</span><span class="mono muted">${a.ou_correct!=null?`O/U ${a.ou_correct?'✓':'✗'}`:''}</span></div>`).join('')}`; }).join('')}</details>`; }
/* ---------- model accuracy dashboard (completed games only; both leagues) ---------- */
let ACC = {live:[], bt:[]};
try{ ACC = JSON.parse(document.getElementById('accdata').textContent); }catch(e){ ACC = null; }
if(ACC){ /* full season: live (locked) picks where tracked; walk-forward back-test for weeks before live tracking began */
  const lk = new Set(ACC.live.map(r=>r[0]+'|'+r[1]+'|'+r[2]));
  ACC.live = ACC.live.map(r=>[...r.slice(0,4),'L']); ACC.bt = ACC.bt.map(r=>[...r.slice(0,4),'B']);
  ACC.all = ACC.live.concat(ACC.bt.filter(r=>!lk.has(r[0]+'|'+r[1]+'|'+r[2])));
}
const LG_NAME = {nfl:'NFL', college:'College'};
function accState(){
  if(!state.acc){ state.acc = {lg:'all', src:'all', season:null, wk:'all', open:true};
    try{ const s=JSON.parse(localStorage.getItem('gl.acc')||'null'); if(s){ if(!s.v2){ delete s.src; delete s.wk; } Object.assign(state.acc, s); } }catch(e){} state.acc.v2=1; }
  return state.acc;
}
function accSave(){ try{ localStorage.setItem('gl.acc', JSON.stringify(state.acc)); }catch(e){} }
function accTally(rows){ let w=0,l=0,t=0; rows.forEach(r=>{ if(r[3]===1) w++; else if(r[3]===0) l++; else t++; }); return {w,l,t,n:w+l,p:(w+l)?w/(w+l):null}; }
function accDash(){
  if(!ACC) return '';
  const a = accState(), all = ACC[a.src]||[];
  const seasons = [...new Set(all.map(r=>r[1]))].sort((x,y)=>y-x);
  if(!seasons.includes(a.season)) a.season = seasons[0] ?? null;
  const inSeason = all.filter(r=>r[1]===a.season);
  const byLg = inSeason.filter(r=>a.lg==='all'||r[0]===a.lg);
  const weeks = [...new Set(byLg.map(r=>r[2]))].sort((x,y)=>x-y);
  if(a.wk!=='all' && !weeks.includes(+a.wk)) a.wk='all';
  const wkOk = r => a.wk==='all' || r[2]===+a.wk;
  const rows = byLg.filter(wkOk), T = accTally(rows);
  const lgT = k => accTally(inSeason.filter(r=>r[0]===k && wkOk(r)));
  const P = x => x==null ? '—' : (100*x).toFixed(1)+'%';
  const opt = (v,l,cur) => `<option value="${v}" ${String(v)===String(cur)?'selected':''}>${l}</option>`;
  const lgTile = k => { const t=lgT(k), off = a.lg!=='all' && a.lg!==k;
    return `<div class="tile${off?' off':''}"><div class="k">${LG_NAME[k]} accuracy</div><div class="v">${off?'—':P(t.p)}</div><div class="s">${off?'filtered out':`${t.w}–${t.l}${t.t?` · ${t.t} tie${t.t>1?'s':''} excluded`:''}`}</div></div>`; };
  const lgs = a.lg==='all' ? ['nfl','college'] : [a.lg];
  const tr = []; lgs.forEach(k=>{ [...new Set(byLg.filter(r=>r[0]===k).map(r=>r[2]))].sort((x,y)=>x-y).forEach(w=>{ const rr=byLg.filter(r=>r[0]===k&&r[2]===w), t=accTally(rr); t.bt = a.src==='all' && rr.length && rr.every(r=>r[4]==='B'); if(t.n) tr.push([k,w,t]); }); });
  const trend = a.wk==='all' && tr.length>1 ? `<div class="acctrend">${tr.map(([k,w,t])=>`<div class="r"><span>${a.lg==='all'?(k==='nfl'?'NFL':'CFB')+' wk ':'Week '}${w}</span><span class="bar${t.bt?' bt':''}"><i style="width:${(100*t.p).toFixed(1)}%"></i></span><span>${t.w}–${t.l} · ${Math.round(100*t.p)}%${t.bt?' <span class="muted">BT</span>':''}</span></div>`).join('')}</div>` : '';
  const firstLive = k => { const w=ACC.live.filter(r=>r[0]===k&&r[1]===a.season).map(r=>r[2]); return w.length?Math.min(...w):null; };
  const comboNote = () => (a.lg==='all'?['nfl','college']:[a.lg]).map(k=>{ const f=firstLive(k); return f==null?`${LG_NAME[k]}: all back-test`:(f>1?`${LG_NAME[k]}: weeks 1–${f-1} back-test (BT), week ${f} on live`:`${LG_NAME[k]}: all live`); }).join(' · ');
  const srcNote = a.src==='all'
    ? `Full season: live picks (locked before kickoff) for every week they were tracked; earlier weeks use the back-test, where each game was predicted by the same model trained only on games before that week. ${comboNote()}.`
    : a.src==='live'
    ? 'Live picks: the model’s pick as locked before kickoff, graded once when the game went final. Earlier predictions are never recalculated.'
    : 'Back-test: each game was predicted by a model trained only on games before that week (walk-forward). Not picks published at the time.';
  const head = T.n ? `${T.w}–${T.l} · ${P(T.p)}` : 'no completed games yet';
  return `<details class="accdash" id="accdash" ${a.open?'open':''}><summary><h2>Model accuracy</h2><span class="head">${head}</span></summary>
  <div class="accf">
    <label>League<select id="accLg">${opt('all','All',a.lg)}${opt('nfl','NFL',a.lg)}${opt('college','College',a.lg)}</select></label>
    <label>Picks<select id="accSrc">${opt('all','Full season',a.src)}${opt('live','Live only',a.src)}${opt('bt','Back-test only',a.src)}</select></label>
    <label>Season<select id="accSeason">${seasons.length?seasons.map(s=>opt(s,s,a.season)).join(''):opt('', '—', '')}</select></label>
    <label>Week<select id="accWk">${opt('all','All',a.wk)}${weeks.map(w=>{ const k=byLg.filter(r=>r[2]===w), b=k.filter(r=>r[4]==='B').length; return opt(w,'Week '+w+(a.src==='all'&&b?(b===k.length?' · back-test':' · part back-test'):''),a.wk); }).join('')}</select></label>
  </div>
  ${T.n ? `<div class="acct">
    <div class="tile big"><div><div class="k">Overall accuracy</div><div class="v">${P(T.p)}</div></div><div class="s">${T.n} completed pick${T.n===1?'':'s'}${a.lg==='all'?' · NFL + College':' · '+LG_NAME[a.lg]}${a.wk==='all'?'':' · Week '+a.wk} · ${a.season}</div></div>
    <div class="tile"><div class="k">Correct picks</div><div class="v">✅ ${T.w}</div></div>
    <div class="tile"><div class="k">Incorrect picks</div><div class="v">❌ ${T.l}</div></div>
    ${lgTile('nfl')}${lgTile('college')}
  </div>${trend}` : `<p class="muted">No completed games for this selection yet. Picks are counted once a game is final.</p>`}
  <p class="accnote">Accuracy = correct picks ÷ completed picks × 100. Upcoming and in-progress games are not counted; ties${T.t?` (${T.t} here)`:''} and canceled games are excluded.${a.lg==='all'&&a.wk!=='all'?' Week numbers follow each league’s own schedule.':''} ${srcNote}</p></details>`;
}
function accRefresh(){ const el=document.getElementById('accdash'); if(!el) return; el.outerHTML = accDash(); }
document.addEventListener('change', e=>{ const id=e.target.id, a=accState(); if(!['accLg','accSrc','accSeason','accWk'].includes(id)) return;
  if(id==='accLg'){ a.lg=e.target.value; a.wk='all'; }
  if(id==='accSrc'){ a.src=e.target.value; a.season=null; a.wk='all'; }
  if(id==='accSeason'){ a.season=+e.target.value; a.wk='all'; }
  if(id==='accWk'){ a.wk=e.target.value; }
  e.stopPropagation(); accSave(); accRefresh(); }, true);
document.addEventListener('toggle', e=>{ if(e.target.id==='accdash'){ accState().open=e.target.open; accSave(); } }, true);

/* ---------- theme toggle: Auto (follows iPhone) / Light (Turf) / Dark (Sunset) ---------- */

        <span class="nwp mono">${pct(g.p_pick)} <span class="tier ${tier.tier}">${tier.tier}</span></span></div>

const teamKey = (...ts) => ts.filter(Boolean).map(t => `${t} ${TEAM_NAMES[t]||''}`).join(' ').toLowerCase();
const normQ = q => q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function teamMatch(key, q){ if(!q) return true; const k=key.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return q.split(/\s+/).every(t => t.length<=3 ? new RegExp('(^|[^a-z0-9])'+t.replace(/[^a-z0-9]/g,'')).test(k) : k.includes(t)); }
function applySearch(){ const q=normQ(state.q||''); let shown=0, total=0;
  document.querySelectorAll('[data-teams]').forEach(el=>{ const ok=teamMatch(el.dataset.teams,q); el.hidden=!ok; total++; if(ok && el.closest('section') && !el.closest('section').hidden) shown++; });
  document.querySelectorAll('section[role="tabpanel"] .day').forEach(d=>{ if(!q){ d.hidden=false; return; }
    let n=d.nextElementSibling, vis=false; while(n && !n.classList.contains('day')){ if(n.matches('[data-teams]') ? !n.hidden : [...n.querySelectorAll('[data-teams]')].some(c=>!c.hidden)) { vis=true; break; } n=n.nextElementSibling; }
    d.hidden=!vis; });
  document.querySelectorAll('details.arch,details.nextwk').forEach(a=>{ const any=[...a.querySelectorAll('[data-teams]')].some(c=>!c.hidden); a.hidden=!!q && !any; if(q && any) a.open=true; });
  const m=document.getElementById('qmsg'); if(m) m.textContent = q ? (shown ? `${shown} game${shown===1?'':'s'} shown` : 'No games match. Try a city, nickname or abbreviation.') : '';
}

      const L = g.latest, p = L.p_home, pick = L.pick, loser = pick===g.home?g.away:g.home, conf = Math.max(p,1-p), tier = tierOf(conf);
      const flags = [];

      flags.unshift(finalChip(g));

      html += `<details class="pick${g.final?' done':''}" id="d-${g.game_id}" data-teams="${esc(teamKey(g.home,g.away)+' '+[g.home_conf,g.away_conf].filter(Boolean).join(' ').toLowerCase())}"><summary>

        <div class="meter"><i style="width:${(conf-0.5)*200}%"></i></div>
        <div class="meta"><span>${fmtTime(g.gametime_et)}</span><span>${g.away} at ${g.home}</span><span class="chip">${g.score?`${g.away} ${g.score.away} – ${g.home} ${g.score.home}${g.score.adjusted?'*':''}`:''}</span>${wxChip(g)}${flags.join('')}</div>
      </summary><div class="why"><ul>${rationale(g)}</ul><div class="mono muted" style="font-size:12px">Projected score ${g.away} ${g.score.away}, ${g.home} ${g.score.home} (margin ${g.score.margin>0?g.home:g.away} by ${Math.abs(g.score.margin).toFixed(1)}, total ${g.score.total.toFixed(0)})${g.score.adjusted?' · *rounded to agree with the pick':''}. Typical error ±${B.score_metrics.margin_mae.toFixed(0)} points on margin.</div>${liveBlock(g)}<button class="more" data-game="${g.game_id}">Full breakdown →</button></div></details>`;
    });
    html += '</div>';
  });
  html += nextWeekBlock();
  html += archiveBlock();
  html += `<p class="mono muted" style="margin:10px 0 0">Reasons are written from the model's largest factor contributions for each game and quote the underlying numbers; they are not editorial opinions.</p><div class="legend">${B.confidence_tiers.map(t=>`<span><span class="tier ${t.tier}" style="padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">${t.tier}</span> ${pct(t.lo)}–${pct(t.hi)} · hit ${pct(t.hit_rate)} of ${t.n} past picks</span>`).join('')}</div>

  el.innerHTML = html;
}

function row(label, hv, av, fmt, higherBetter){
  const hb = hv!=null&&av!=null&&hv!==av ? ((hv>av)===higherBetter) : null;
  return `<tr><td>${label}</td><td class="${hb===false?'better':''}">${fmt(av)}</td><td class="${hb===true?'better':''}">${fmt(hv)}</td></tr>`;
}

/* ---------- Results (walk-forward) ---------- */
function renderResults(){
  const el = $('#tab-results');
  const seasons = [...new Set(B.history.map(h=>h.season))].sort((a,b)=>b-a);
  const sel = state.rs ?? seasons[0];
  const rows = B.history.filter(h=>h.season===sel);
  const weeks = [...new Set(rows.map(r=>r.week))].sort((a,b)=>b-a);
  const decided = rows.filter(r=>r.home_win!==0.5);
  const acc = decided.filter(r=>(r.p_home>0.5)===(r.home_win===1)).length;
  const brier = rows.reduce((s,r)=>s+(r.p_home-r.home_win)**2,0)/rows.length;
  const mk = decided.filter(r=>r.mkt!=null); const macc = mk.filter(r=>(r.mkt>0.5)===(r.home_win===1)).length;
  let html = `<div class="sel"><label for="rs">Season</label><select id="rs">${seasons.map(s=>`<option ${s===sel?'selected':''}>${s}</option>`).join('')}</select>
    <span class="mono muted">Each game was predicted by a model trained only on games before that week (walk-forward).</span></div>
    <div class="tiles"><div class="tile"><div class="k">Model record</div><div class="v">${acc}–${decided.length-acc}</div><div class="s">${pct(acc/decided.length)} winners</div></div>
    <div class="tile"><div class="k">Brier score</div><div class="v">${brier.toFixed(4)}</div><div class="s">lower is better; 0.25 = coin flip</div></div>
    <div class="tile"><div class="k">Market favorite</div><div class="v">${mk.length?pct(macc/mk.length):'—'}</div><div class="s">closing-line benchmark</div></div>
    ${(()=>{const a=atsRecord(rows); return a.w+a.l?`<div class="tile"><div class="k">Against the spread</div><div class="v">${a.w}–${a.l}</div><div class="s">${pct(a.w/(a.w+a.l))} model · favorite ${pct(a.fw/(a.fw+a.fl))}</div></div>`:''})()}
    ${(()=>{const o=ouRecord(rows); return o.n?`<div class="tile"><div class="k">Over/under</div><div class="v">${o.w}–${o.l}</div><div class="s">${pct(o.w/o.n)} model side · overs hit ${pct(o.o/o.n)}</div></div>`:''})()}
    ${sel===seasons[0]?clvTiles():''}
    <div class="tile"><div class="k">Home team</div><div class="v">${pct(decided.filter(r=>r.home_win===1).length/decided.length)}</div><div class="s">always-pick-home</div></div></div>`;
  weeks.forEach(w=>{
    const wr = rows.filter(r=>r.week===w);
    const wa = wr.filter(r=>r.home_win!==0.5&&(r.p_home>0.5)===(r.home_win===1)).length;
    html += `<div class="day">Week ${w} · ${wa}–${wr.filter(r=>r.home_win!==0.5).length-wa}</div>`;
    wr.forEach(r=>{
      const pick = r.p_home>=0.5?r.home:r.away, conf = Math.max(r.p_home,1-r.p_home);
      const won = r.home_win===0.5?'tie':(((r.p_home>0.5)===(r.home_win===1))?'ok':'miss');
      html += `<div class="res" data-teams="${esc(teamKey(r.home,r.away))}"><span class="${won}">${won==='ok'?'✓':won==='miss'?'✗':'='}</span><span>${r.away} ${r.away_score} at ${r.home} ${r.home_score}${atsMark(r)}${ouMark(r)}${r.pred_home!=null?` <span class="muted mono">(proj ${r.pred_away}–${r.pred_home})</span>`:''}</span><span class="mono">${pick} ${pct(conf)}</span><span class="mono muted">${r.mkt!=null?'mkt '+(r.mkt>=0.5?r.home:r.away)+' '+pct(Math.max(r.mkt,1-r.mkt)):''}</span></div>`;
    });
  });
  el.innerHTML = html;
  $('#rs').addEventListener('change', e=>{ state.rs=+e.target.value; renderResults(); });
}

/* ---------- Model performance ---------- */
function calChart(cal){
  const W=360,H=260,m={l:40,r:10,t:10,b:36}; const x=v=>m.l+v*(W-m.l-m.r), y=v=>H-m.b-v*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block" role="img" aria-label="Calibration: predicted vs actual home win rate">`;
  [0,.25,.5,.75,1].forEach(v=>{ s+=`<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text><text x="${x(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text>`; });
  s+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const maxn=Math.max(...cal.map(c=>c.n));
  cal.forEach(c=>{ const r=4+8*Math.sqrt(c.n/maxn); s+=`<circle cx="${x(c.pred)}" cy="${y(c.actual)}" r="${r}" fill="var(--accent)" fill-opacity=".75" stroke="var(--accent)"/>`; });
  s+=`<text x="${(x(0)+x(1))/2}" y="${H-4}" text-anchor="middle">predicted home win probability</text><text transform="rotate(-90)" x="${-(y(0)+y(1))/2}" y="12" text-anchor="middle">actual home win rate</text></svg>`;
  return s;
}

    <div class="panel tscroll"><table><thead><tr><th>Predicted</th><th>Games</th><th>Avg pred</th><th>Actual</th></tr></thead><tbody>

    <p><span class="pill warn">Updated</span> ${esc(D.updated_cutoff)}</p>
    ${D.crunch?`<h2>Two picks per game</h2><p><b>Main pick.</b> ${esc(D.crunch)}</p><p><b>Stats-only pick.</b> ${esc(D.stats_only)}</p>`:''}
    <h2>How the model is trained</h2><p>${esc(D.training)}</p>
    <p>Opponent adjustment: for each week, every team's offensive and defensive EPA/play, success rate, pass/rush EPA, explosive-play rate and points per drive are solved jointly by ridge regression (offense strength − opponent defense strength + home term), using this season's prior weeks with last season as a 0.3-weighted prior. Quarterback form uses the expected starter's trailing ~400 dropbacks across seasons, shrunk toward league average with a 150-dropback prior, so a new starter is pulled toward average rather than treated as unknown. Rates with small samples (third down, red zone, field goals, sacks, interceptions) are shrunk toward league rates.</p>
    <h2>Weather</h2><p>${esc(B.weather_meta.model_note)} ${esc(B.weather_meta.sources)} Forecasts are refreshed on every run and the prediction is re-issued; the first Tuesday call stays on record for comparison.</p>

    <p>Live lines and injury statuses come from ESPN's public data and are checked every run (hourly on game days). A pick made before the line is available uses the stats-only model and says so. Line movement is shown for context; it says where the price went, not who bet.</p>
    <h2>Data</h2><ul>${d.sources.filter(s=>!s.startsWith('Open-Meteo')).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>

}
