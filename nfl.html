<style>
/* Layout: a scoreboard ledger. Single column on phones, two-column game detail on desktop. Ink on paper-grey with a turf-green accent; probabilities set in mono. */
:root{
  --bg:#f3f3ef; --surface:#ffffff; --line:#d9dad3; --fg:#17201b; --muted:#5e665f;
  --accent:#1f7a4d; --accent-fg:#ffffff; --accent-soft:#dcefe3;
  --warn:#9a6200; --warn-soft:#fbefd6; --away:#3a5aa8; --home:#1f7a4d;
  --display:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1b211c; --line:#2d352f; --fg:#e8ebe6; --muted:#9aa49c;
  --accent:#4fbf85; --accent-fg:#0f1711; --accent-soft:#1d3528; --warn:#e2a83c; --warn-soft:#3a2d12; --away:#8aa3e6; --home:#4fbf85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1b211c; --line:#2d352f; --fg:#e8ebe6; --muted:#9aa49c;
  --accent:#4fbf85; --accent-fg:#0f1711; --accent-soft:#1d3528; --warn:#e2a83c; --warn-soft:#3a2d12; --away:#8aa3e6; --home:#4fbf85; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:700;font-stretch:87.5%}
.brand .wk{font-family:var(--mono);font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fresh{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);padding-block:12px 4px}
.fresh b{color:var(--fg);font-weight:500}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.pill.early{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.notice{background:var(--warn-soft);color:var(--warn);border-left:3px solid var(--warn);padding:10px 12px;font-size:14px;margin-block:14px;border-radius:0 6px 6px 0}
section[role="tabpanel"]{padding-block:8px}
h2{font-size:17px;margin:18px 0 8px;font-weight:700;font-stretch:87.5%}
h3{font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.day{font-family:var(--mono);font-size:12px;color:var(--muted);margin:16px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;gap:8px;text-align:left;font:inherit;color:inherit;width:100%}
.card:focus-visible{outline:2px solid var(--accent)}
.card .teams{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .t{font-size:20px;font-weight:700;font-stretch:87.5%}
.card .t.pick::after{content:"▲";font-size:10px;margin-left:6px;color:var(--accent);vertical-align:middle}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .a{background:var(--away)} .bar .h{background:var(--home)}
.probs{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.detail{display:grid;gap:14px}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;color:var(--fg);cursor:pointer}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.hero .big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.hero .big .t{font-size:30px;font-weight:700;font-stretch:87.5%;line-height:1}
.hero .big .p{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}
.hero .big .at{color:var(--muted);font-size:13px}
.hero .sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.factor{display:grid;grid-template-columns:1fr 100px 48px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.factor:last-child{border-bottom:0}
.factor .fb{height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.factor .fb i{position:absolute;top:0;height:100%}
.factor .fb .pos{left:50%;background:var(--home)} .factor .fb .neg{right:50%;background:var(--away)}
.factor .v{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
td.better{color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px}
svg text{fill:var(--fg);font-family:var(--mono);font-size:11px}
.res{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.res .ok{color:var(--accent);font-weight:700} .res .miss{color:var(--warn);font-weight:700}
.sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block:8px}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
p{max-width:68ch}
ul{padding-left:20px;max-width:70ch}
/* landing */
.status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);padding-block:10px 2px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:4px}
.picks{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:720px){.picks{grid-template-columns:1fr 1fr}}
details.pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden}
details.pick>summary{display:grid;grid-template-columns:1fr auto;grid-template-areas:"main conf" "meter meter" "meta meta";gap:4px 12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
details.pick>summary::-webkit-details-marker{display:none}
details.pick>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.pick[open]>summary{border-bottom:1px solid var(--line)}
.why{padding:10px 14px 12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.why .live,.why .tscroll{min-width:0;max-width:100%}
.why table{font-size:12px}
.why th,.why td{padding:5px 6px}
.why ul{margin:0;padding-left:18px;max-width:none;display:grid;gap:5px;font-size:14px;line-height:1.4}
.why li.against{color:var(--muted)}
.why .more{justify-self:start;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.why .more:hover{border-color:var(--accent)}
.pick .main .hint{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
details.pick[open] .hint{display:none}
.pick .main{grid-area:main;min-width:0}
.pick .winner{font-size:24px;font-weight:700;font-stretch:87.5%;line-height:1.1;letter-spacing:-.01em}
.pick .winner small{font-size:15px;font-weight:500;color:var(--muted);font-stretch:100%}
.pick .conf{grid-area:conf;text-align:right}
.pick .conf .p{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.pick .conf .tier{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tier.Strong{background:var(--accent);color:var(--accent-fg)} .tier.Moderate{background:var(--accent-soft);color:var(--accent)} .tier.Lean{background:var(--line);color:var(--muted)}
.pick .meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.pick .meter{grid-area:meter;margin-block:2px 4px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pick .meter i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-family:var(--mono);color:var(--fg)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:14px 0 4px}
@media(prefers-reduced-motion:no-preference){.card,details.pick{transition:border-color .15s}.card:hover,details.pick:hover{border-color:var(--accent)}}
</style>

const tierHit = name => { const t=B.confidence_tiers.find(t=>t.tier===name); return t&&t.hit_rate!=null?pct(t.hit_rate):'—'; };

    d_pass_vs_passdef:[p=>p.adj_pass_epa,true], d_rush_vs_rundef:[p=>p.adj_rush_epa,true], d_pp_vs_rush:[p=>p.sack_rate_off,false], d_fg_rate:[p=>p.fg_rate,true], d_fg_long_rate:[p=>p.fg_long_rate,true],
    d_pen_per_game:[p=>p.pen_per_game,false], d_elo:[p=>p.elo,true], d_l3_off_epa:[p=>p.l3_off_epa,true], d_l3_def_epa:[p=>p.l3_def_epa,false], d_l3_ppd:[p=>p.l3_ppd,true],
    d_adj_off_off_sr:[p=>p.adj_off_sr,true], d_adj_off_ppd:[p=>p.adj_ppd,true], d_adj_def_ppd:[p=>p.adj_def_ppd,true], d_adj_off_pass_epa:[p=>p.adj_pass_epa,true], d_adj_def_pass_epa:[p=>p.adj_def_pass_epa,true],
    d_adj_off_rush_epa:[p=>p.adj_rush_epa,true], d_adj_def_rush_epa:[p=>p.adj_def_rush_epa,true], d_adj_off_explosive_rate:[p=>p.adj_explosive,true], d_adj_def_explosive_rate:[p=>p.adj_def_explosive,true],
    d_explosive_edge:[p=>p.adj_explosive,true], d_inj_starters_out:[p=>-(p.inj_starters_out||0),true], d_ngs_ryoe:[p=>p.ngs_ryoe,true], d_ngs_sep:[p=>p.ngs_sep,true], d_ngs_yacoe:[p=>p.ngs_yacoe,true],
  };
  const consistent = (key, pickTeam)=>{ const c=CHK[key]; if(!c) return true; const PP = pickTeam===g.home?g.home_profile:g.away_profile, OO = pickTeam===g.home?g.away_profile:g.home_profile;
    const pv=c[0](PP), ov=c[0](OO); if(pv==null||ov==null||pv===ov) return true; return (pv>ov)===c[1]; };
  const fallback = (f, pickTeam)=>`${f.feature}: the model's learned weight on this input tilts toward ${pickTeam} once the other factors are accounted for (the raw numbers alone would not show it).`;
  const fs = L.factors.map(f=>({...f, s: f.logit*sign})).filter(f=>T[f.key] && Math.abs(f.logit)>=0.03);
  const forPick = fs.filter(f=>f.s>0).slice(0,3), against = fs.filter(f=>f.s<0).slice(0,1);
  const seen = new Set(); const bullets = forPick.map(f=>consistent(f.key,pick)?T[f.key]():fallback(f,pick)).filter(t=>!seen.has(t)&&seen.add(t)).map(t=>`<li>${t}</li>`);
  if(bullets.length<2 && L.intercept_logit*sign>0) bullets.push(`<li>Home field: the baseline edge for the home team is worth about ${pct(1/(1+Math.exp(-L.intercept_logit)))} before any matchup factors.</li>`);
  if(bullets.length===0) bullets.push(`<li>No single factor stands out; this is close to a coin flip on the numbers.</li>`);
  const ag = against.map(f=>`<li class="against">On the other side: ${consistent(f.key,other)?rationaleFor(g, other)[f.key]():fallback(f,other)}</li>`);
  return bullets.concat(ag).join('');
}

/* ---------- Results (walk-forward) ---------- */
function renderResults(){
  const el = $('#tab-results');
  const seasons = [...new Set(B.history.map(h=>h.season))].sort((a,b)=>b-a);
  const sel = state.rs ?? seasons[0];
  const rows = B.history.filter(h=>h.season===sel);
  const weeks = [...new Set(rows.map(r=>r.week))].sort((a,b)=>b-a);
  const decided = rows.filter(r=>r.home_win!==0.5);
  const acc = decided.filter(r=>(r.p_home>0.5)===(r.home_win===1)).length;
  const brier = rows.reduce((s,r)=>s+(r.p_home-r.home_win)**2,0)/rows.length;
  const mk = decided.filter(r=>r.mkt!=null); const macc = mk.filter(r=>(r.mkt>0.5)===(r.home_win===1)).length;
  let html = `<div class="sel"><label for="rs">Season</label><select id="rs">${seasons.map(s=>`<option ${s===sel?'selected':''}>${s}</option>`).join('')}</select>
    <span class="mono muted">Each game was predicted by a model trained only on games before that week (walk-forward).</span></div>
    <div class="tiles"><div class="tile"><div class="k">Model record</div><div class="v">${acc}–${decided.length-acc}</div><div class="s">${pct(acc/decided.length)} winners</div></div>
    <div class="tile"><div class="k">Brier score</div><div class="v">${brier.toFixed(4)}</div><div class="s">lower is better; 0.25 = coin flip</div></div>
    <div class="tile"><div class="k">Market favorite</div><div class="v">${mk.length?pct(macc/mk.length):'—'}</div><div class="s">closing-line benchmark</div></div>
    ${(()=>{const a=atsRecord(rows); return a.w+a.l?`<div class="tile"><div class="k">Against the spread</div><div class="v">${a.w}–${a.l}</div><div class="s">${pct(a.w/(a.w+a.l))} model · favorite ${pct(a.fw/(a.fw+a.fl))}</div></div>`:''})()}
    <div class="tile"><div class="k">Home team</div><div class="v">${pct(decided.filter(r=>r.home_win===1).length/decided.length)}</div><div class="s">always-pick-home</div></div></div>`;
  weeks.forEach(w=>{
    const wr = rows.filter(r=>r.week===w);
    const wa = wr.filter(r=>r.home_win!==0.5&&(r.p_home>0.5)===(r.home_win===1)).length;
    html += `<div class="day">Week ${w} · ${wa}–${wr.filter(r=>r.home_win!==0.5).length-wa}</div>`;
    wr.forEach(r=>{
      const pick = r.p_home>=0.5?r.home:r.away, conf = Math.max(r.p_home,1-r.p_home);
      const won = r.home_win===0.5?'tie':(((r.p_home>0.5)===(r.home_win===1))?'ok':'miss');
      html += `<div class="res"><span class="${won}">${won==='ok'?'✓':won==='miss'?'✗':'='}</span><span>${r.away} ${r.away_score} at ${r.home} ${r.home_score}${atsMark(r)}${r.pred_home!=null?` <span class="muted mono">(proj ${r.pred_away}–${r.pred_home})</span>`:''}</span><span class="mono">${pick} ${pct(conf)}</span><span class="mono muted">${r.mkt!=null?'mkt '+(r.mkt>=0.5?r.home:r.away)+' '+pct(Math.max(r.mkt,1-r.mkt)):''}</span></div>`;
    });
  });
  el.innerHTML = html;
  $('#rs').addEventListener('change', e=>{ state.rs=+e.target.value; renderResults(); });
}

/* ---------- Model performance ---------- */
function calChart(cal){
  const W=360,H=260,m={l:40,r:10,t:10,b:36}; const x=v=>m.l+v*(W-m.l-m.r), y=v=>H-m.b-v*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block" role="img" aria-label="Calibration: predicted vs actual home win rate">`;
  [0,.25,.5,.75,1].forEach(v=>{ s+=`<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text><text x="${x(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text>`; });
  s+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const maxn=Math.max(...cal.map(c=>c.n));
  cal.forEach(c=>{ const r=4+8*Math.sqrt(c.n/maxn); s+=`<circle cx="${x(c.pred)}" cy="${y(c.actual)}" r="${r}" fill="var(--accent)" fill-opacity=".75" stroke="var(--accent)"/>`; });
  s+=`<text x="${(x(0)+x(1))/2}" y="${H-4}" text-anchor="middle">predicted home win probability</text><text transform="rotate(-90)" x="${-(y(0)+y(1))/2}" y="12" text-anchor="middle">actual home win rate</text></svg>`;
  return s;
}

    <p>${esc(B.definitions.scores)}</p>
    <h2>Calibration</h2>
    <div class="two"><div class="panel">${calChart(e.calibration)}<p class="mono muted" style="margin:6px 0 0">Dot size = number of games in the bin. Points on the dashed line are perfectly calibrated.</p></div>
    <div class="panel tscroll"><table><thead><tr><th>Predicted</th><th>Games</th><th>Avg pred</th><th>Actual</th></tr></thead><tbody>
      ${e.calibration.map(c=>`<tr><td>${c.lo.toFixed(1)}–${c.hi.toFixed(1)}</td><td>${c.n}</td><td>${pct(c.pred)}</td><td>${pct(c.actual)}</td></tr>`).join('')}</tbody></table></div></div>

    ${B.coefficients.crunch?`<h2>Learned weights (final model: stats + betting line)</h2><div class="tscroll"><table><thead><tr><th>Feature</th><th>Weight</th></tr></thead><tbody>${Object.entries(B.coefficients.crunch).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`<tr><td>${esc(B.feature_labels[k]||k)}</td><td>${f3(v)}</td></tr>`).join('')}</tbody></table></div>`:''}

/* ---------- About ---------- */

  const D=B.definitions, d=B.data;
  $('#tab-about').innerHTML = `
    <h2>What is predicted</h2><p>${esc(D.target)}</p>
    <h2>Prediction cutoffs</h2>
    <p><span class="pill early">Early</span> ${esc(D.early_cutoff)}</p>
    <p><span class="pill warn">Updated</span> ${esc(D.updated_cutoff)}</p>
    ${D.crunch?`<h2>Two picks per game</h2><p><b>Main pick.</b> ${esc(D.crunch)}</p><p><b>Stats-only pick.</b> ${esc(D.stats_only)}</p>`:''}
    <h2>How the model is trained</h2><p>${esc(D.training)}</p>
    <p>Opponent adjustment: for each week, every team's offensive and defensive EPA/play, success rate, pass/rush EPA, explosive-play rate and points per drive are solved jointly by ridge regression (offense strength − opponent defense strength + home term), using this season's prior weeks with last season as a 0.3-weighted prior. Quarterback form uses the expected starter's trailing ~400 dropbacks across seasons, shrunk toward league average with a 150-dropback prior, so a new starter is pulled toward average rather than treated as unknown. Rates with small samples (third down, red zone, field goals, sacks, interceptions) are shrunk toward league rates.</p>
    <h2>Weather</h2><p>${esc(B.weather_meta.model_note)} ${esc(B.weather_meta.sources)} Forecasts are refreshed on every run and the prediction is re-issued; the first Tuesday call stays on record for comparison.</p>

    <p>Live lines and injury statuses come from ESPN's public data and are checked every run (hourly on game days). A pick made before the line is available uses the stats-only model and says so. Line movement is shown for context; it says where the price went, not who bet.</p>
    <h2>Data</h2><ul>${d.sources.filter(s=>!s.startsWith('Open-Meteo')).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>

renderWeek(); renderResults(); renderModel(); renderAbout(); showTab(state.tab);
