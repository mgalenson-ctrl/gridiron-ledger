name: Daily refresh and publish
on:
  schedule:
    - cron: "30 11 * * *"   # 6:30 AM Central (daylight time); 5:30 AM in winter
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files into folders (one-time, after a flat upload)
        run: |
          python3 - <<'PY'
          import os, glob, json, shutil, sys
          if os.path.isdir('nfl') and os.path.isdir('college') and os.path.isdir('site'): print('layout ok'); sys.exit(0)
          def mv(src, dst):
              if os.path.exists(src): os.makedirs(os.path.dirname(dst), exist_ok=True); shutil.move(src, dst); print(src, '->', dst)
          for f in ('build_features.py','train.py','predict.py'): mv(f, f'nfl/{f}')
          for f in ('cfb_build.py','cfb_train.py','cfb_predict.py','extract_pbp.py','rds_reader.py','team_info.py'): mv(f, f'college/{f}')
          for f in ('run_nfl.sh','run_college.sh','weather_fetch.py'): mv(f, f'scripts/{f}')
          mv('build_site.py','site/build_site.py')
          for f in ('manifest.webmanifest','sw.js'): mv(f, f'site/static/{f}')
          for f in glob.glob('icon-*.png'): mv(f, f'site/static/icons/{f}')
          for f in glob.glob('app_template*.html'):
              mv(f, ('college' if '<title>Gridiron Ledger College</title>' in open(f).read() else 'nfl') + '/app_template.html')
          for f in glob.glob('predictions_log*.json'):
              k = next(iter(json.load(open(f))), '')
              mv(f, ('nfl' if '_' in k else 'college') + '/out/predictions_log.json')
          need = ['nfl/build_features.py','nfl/train.py','nfl/predict.py','nfl/app_template.html','college/cfb_build.py','college/cfb_train.py','college/cfb_predict.py','college/extract_pbp.py','college/rds_reader.py','college/team_info.py','college/app_template.html','scripts/run_nfl.sh','scripts/run_college.sh','scripts/weather_fetch.py','site/build_site.py','site/static/manifest.webmanifest','site/static/sw.js','site/static/icons/icon-192.png','requirements.txt']
          missing = [p for p in need if not os.path.exists(p)]
          if missing: sys.exit('missing files: ' + ', '.join(missing))
          print('arranged')
          PY
          git config user.name "gridiron-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Arrange project folders" && git push)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Map the folders the pipelines expect
        run: |
          sudo mkdir -p /home/claude && sudo chown "$USER" /home/claude
          ln -s "$GITHUB_WORKSPACE/nfl" /home/claude/nflpredict
          ln -s "$GITHUB_WORKSPACE/college" /home/claude/cfbpredict
          mkdir -p /home/claude/nflverse /home/claude/sportsdataverse nfl/out college/out
      - name: NFL picks
        id: nfl
        continue-on-error: true
        run: bash scripts/run_nfl.sh
      - name: College picks
        id: college
        continue-on-error: true
        run: bash scripts/run_college.sh
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build site
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 site/build_site.py
      - name: Save the prediction log
        run: |
          git config user.name "gridiron-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl/out/predictions_log.json college/out/predictions_log.json
          git diff --cached --quiet || git commit -m "Daily prediction log $(date -u +%F)"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: |
            nfl/out/snapshots/
            college/out/snapshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Report pipeline status
        if: steps.nfl.outcome == 'failure' || steps.college.outcome == 'failure'
        run: echo "::warning::NFL=${{ steps.nfl.outcome }} College=${{ steps.college.outcome }} (a failed sport keeps its previous page)"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
