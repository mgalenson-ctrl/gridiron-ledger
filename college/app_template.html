<title>Hunch vs. Crunch College</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,500;87.5,700;100,400;100,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scoreboard ledger. Single column on phones, two-column game detail on desktop. Ink on paper-grey with a turf-green accent; probabilities set in mono. */
:root{
  --bg:#f1f4ee; --surface:#ffffff; --line:#dbe2d4; --fg:#142014; --muted:#5a6857;
  --accent:#1f7d35; --accent-fg:#ffffff; --accent-soft:#dcf2dd;
  --warn:#a35c00; --warn-soft:#fdeed6; --away:#2f5bd3; --home:#1f7d35;
  --done-bg:#e6ebe1; --done-chip:#f4f6f1;
  --hdr-bg:repeating-linear-gradient(90deg,#2c7a34 0 38px,#2f8438 38px 76px); --hdr-fg:#ffffff; --hdr-sub:rgba(255,255,255,.86); --hdr-acc:#ffffff; --hdr-edge:#ffffff; --hdr-shadow:0 3px 0 #2c7a34;
  --card-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --display:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17111f; --surface:#221a2e; --line:#3a2e4a; --fg:#f7eef6; --muted:#b3a3bb;
  --accent:#ff7a59; --accent-fg:#1a0f14; --accent-soft:#3d2228; --warn:#ffd166; --warn-soft:#3a3018; --away:#7cc4ff; --home:#ff7a59; --done-bg:#1b1424; --done-chip:#2a2036;
  --hdr-bg:linear-gradient(120deg,#5b1f5e,#c2405a 60%,#f07a45); --hdr-fg:#ffffff; --hdr-sub:rgba(255,255,255,.82); --hdr-acc:#ffd166; --hdr-edge:transparent; --hdr-shadow:0 2px 14px rgba(0,0,0,.35);
  --card-shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17111f; --surface:#221a2e; --line:#3a2e4a; --fg:#f7eef6; --muted:#b3a3bb;
  --accent:#ff7a59; --accent-fg:#1a0f14; --accent-soft:#3d2228; --warn:#ffd166; --warn-soft:#3a3018; --away:#7cc4ff; --home:#ff7a59; --done-bg:#1b1424; --done-chip:#2a2036;
  --hdr-bg:linear-gradient(120deg,#5b1f5e,#c2405a 60%,#f07a45); --hdr-fg:#ffffff; --hdr-sub:rgba(255,255,255,.82); --hdr-acc:#ffd166; --hdr-edge:transparent; --hdr-shadow:0 2px 14px rgba(0,0,0,.35);
  --card-shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:700;font-stretch:87.5%}
.brand .wk{font-family:var(--mono);font-size:13px;color:var(--muted)}
.searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 10px}
.searchbar input{flex:1;min-width:200px;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.searchbar input:focus{outline:2px solid var(--accent);outline-offset:0}
#qmsg{font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fresh{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);padding-block:12px 4px}
.fresh b{color:var(--fg);font-weight:500}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.pill.early{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.notice{background:var(--warn-soft);color:var(--warn);border-left:3px solid var(--warn);padding:10px 12px;font-size:14px;margin-block:14px;border-radius:0 6px 6px 0}
section[role="tabpanel"]{padding-block:8px}
h2{font-size:17px;margin:18px 0 8px;font-weight:700;font-stretch:87.5%}
h3{font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.day{font-family:var(--mono);font-size:12px;color:var(--muted);margin:16px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;gap:8px;text-align:left;font:inherit;color:inherit;width:100%}
.card:focus-visible{outline:2px solid var(--accent)}
.card .teams{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .t{font-size:20px;font-weight:700;font-stretch:87.5%}
.card .t.pick::after{content:"▲";font-size:10px;margin-left:6px;color:var(--accent);vertical-align:middle}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .a{background:var(--away)} .bar .h{background:var(--home)}
.probs{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.detail{display:grid;gap:14px}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;color:var(--fg);cursor:pointer}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.hero .big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.hero .big .t{font-size:22px;overflow-wrap:anywhere;font-weight:700;font-stretch:87.5%;line-height:1}
.hero .big .p{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}
.hero .big .at{color:var(--muted);font-size:13px}
.hero .sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.factor{display:grid;grid-template-columns:1fr 100px 48px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.factor:last-child{border-bottom:0}
.factor .fb{height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.factor .fb i{position:absolute;top:0;height:100%}
.factor .fb .pos{left:50%;background:var(--home)} .factor .fb .neg{right:50%;background:var(--away)}
.factor .v{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
td.better{color:var(--accent);font-weight:600}
details.accdash{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 12px}
details.accdash>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
details.accdash>summary::-webkit-details-marker{display:none}
details.accdash>summary h2{margin:0;font-size:17px}
details.accdash>summary .head{font-family:var(--mono);font-size:13px}
.accf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.accf label{display:flex;flex-direction:column;font-family:var(--mono);font-size:11px;color:var(--muted);gap:2px}
.accf select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 4px;min-width:0;width:100%}
@media (max-width:520px){.accf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acct{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.acct .tile{padding:10px}
.acct .tile.big{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.acct .tile.big .v{font-size:34px}
.acct .tile.off{opacity:.45}
.acctrend{margin:10px 0 2px;display:grid;gap:4px}
.acctrend .r{display:grid;grid-template-columns:6.5em 1fr 10.5em;gap:8px;white-space:nowrap;align-items:center;font-family:var(--mono);font-size:12px}
.acctrend .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.acctrend .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.acctrend .bar.bt i{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 45%,transparent) 4px 8px)}
.accnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px}
svg text{fill:var(--fg);font-family:var(--mono);font-size:11px}
.res{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.res .ok{color:var(--accent);font-weight:700} .res .miss{color:var(--warn);font-weight:700}
.sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block:8px}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
p{max-width:68ch}
ul{padding-left:20px;max-width:70ch}
/* landing */
.status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);padding-block:10px 2px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:4px}
.picks{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:720px){.picks{grid-template-columns:1fr 1fr}}
details.pick.done{background:var(--done-bg);border-color:var(--line)}
details.pick.done .winner{color:var(--muted)}
.chip.final{background:var(--done-chip);border-color:var(--line);font-weight:600}
.res.done{grid-template-columns:auto 1fr auto auto}
details.arch{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--done-bg)}
details.arch>summary{cursor:pointer;font-weight:600}
details.pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden}
details.pick>summary{display:grid;grid-template-columns:1fr auto;grid-template-areas:"main conf" "meter meter" "meta meta";gap:4px 12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
details.pick>summary::-webkit-details-marker{display:none}
details.pick>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.pick[open]>summary{border-bottom:1px solid var(--line)}
.why{padding:10px 14px 12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.why .live,.why .tscroll{min-width:0;max-width:100%}
.why table{font-size:12px}
.why th,.why td{padding:5px 6px}
.why ul{margin:0;padding-left:18px;max-width:none;display:grid;gap:5px;font-size:14px;line-height:1.4}
.why li.against{color:var(--muted)}
.why .more{justify-self:start;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.why .more:hover{border-color:var(--accent)}
.pick .main .hint{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
details.pick[open] .hint{display:none}
.pick .main{grid-area:main;min-width:0}
.pick .winner{font-size:20px;overflow-wrap:anywhere;font-weight:700;font-stretch:87.5%;line-height:1.1;letter-spacing:-.01em}
.pick .winner small{font-size:15px;font-weight:500;color:var(--muted);font-stretch:100%}
.pick .conf{grid-area:conf;text-align:right}
.pick .conf .p{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.pick .conf .tier{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tier.Strong{background:var(--accent);color:var(--accent-fg)} .tier.Moderate{background:var(--accent-soft);color:var(--accent)} .tier.Lean{background:var(--line);color:var(--muted)}
.pick .meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.pick .meter{grid-area:meter;margin-block:2px 4px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pick .meter i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-family:var(--mono);color:var(--fg)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:14px 0 4px}
@media(prefers-reduced-motion:no-preference){.card,details.pick{transition:border-color .15s}.card:hover,details.pick:hover{border-color:var(--accent)}}
/* Theme: Gameday Turf (light) / Sunset (dark) */
header.top{background:var(--hdr-bg);border-bottom:4px solid var(--hdr-edge);box-shadow:var(--hdr-shadow);margin-inline:-16px;padding-inline:16px}
.brand h1{color:var(--hdr-fg);text-transform:uppercase;letter-spacing:.04em;font-size:23px}
.brand .wk,#qmsg,.brand h1 .muted{color:var(--hdr-sub)}
nav.tabs button{color:var(--hdr-sub)} nav.tabs button[aria-selected="true"]{color:var(--hdr-fg);border-bottom-color:var(--hdr-acc)}
nav.tabs button:focus-visible{outline-color:var(--hdr-fg)}
.searchbar input{border-color:transparent}
.searchbar input:focus{outline-color:var(--hdr-acc)}
details.pick,.card,details.accdash,.tile{border-radius:12px}
details.pick,.card,details.accdash{box-shadow:var(--card-shadow)}
details.pick{border-left:5px solid var(--accent)}
details.pick.done{border-left-color:var(--line)}
.pick .meter{height:6px;border-radius:3px} .pick .conf .p{font-weight:600}
.brandr{display:inline-flex;align-items:center}
.themebtn{font:inherit;font-family:var(--mono);font-size:12px;color:var(--hdr-fg);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;cursor:pointer;margin-left:8px}
</style>
<div class="wrap">
<header class="top">
  <div class="brand"><h1>Hunch vs. Crunch <span class="muted" style="font-weight:500">College</span></h1><span class="brandr"><span class="wk" id="wkLabel"></span><button type="button" class="themebtn" id="themeBtn" aria-label="Color theme">◐ Auto</button></span></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="week" aria-selected="true">Picks</button>

  <div class="searchbar"><input type="search" id="q" placeholder="Search team: Bears, CHI, Ohio State…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search by team"><span id="qmsg" class="mono muted"></span></div>
</header>

<script type="application/json" id="accdata">__ACCDATA__</script>
<script>
const B = JSON.parse(document.getElementById('bundle').textContent);
const $ = s => document.querySelector(s);
const pct = p => (p*100).toFixed(0)+'%';
const f3 = v => v==null?'—':(v>=0?'+':'')+v.toFixed(3);
const f2 = v => v==null?'—':v.toFixed(2);
const fp = v => v==null?'—':(v*100).toFixed(1)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = t => { const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap} ET`; };
const fmtDay = d => new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const tierOf = c => { for(const t of B.confidence_tiers){ if(c>=t.lo && c<t.hi) return t; } return B.confidence_tiers[B.confidence_tiers.length-1]; };
const tierHit = name => { const t=B.confidence_tiers.find(t=>t.tier===name); return t&&t.hit_rate!=null?pct(t.hit_rate):'—'; };
function wxChip(g){ const w=g.weather; if(!w) return '';
  if(w.status==='roofed') return `<span class="chip">Roof</span>`;
  if(w.status==='forecast') return `<span class="chip">${Math.round(w.temp_f)}°F · ${Math.round(w.wind_mph)} mph${w.gust_mph?` (gusts ${Math.round(w.gust_mph)})`:''}${w.pop_pct!=null?` · ${Math.round(w.pop_pct)}% rain`:''}${w.retractable?' · retractable':''}</span>`;
  return `<span class="chip warn">No forecast</span>`; }
/* Plain-language rationale built from the model's own factor contributions. Each bullet quotes the inputs behind a factor;
   wording is templated per feature, never free-form, so it cannot invent reasons the model did not use. */
const f3s = v => (v>=0?'+':'')+v.toFixed(2);
function rationaleFor(g, pick){
  const L=g.latest, other=pick===g.home?g.away:g.home;
  const P = pick===g.home?g.home_profile:g.away_profile, O = pick===g.home?g.away_profile:g.home_profile;
  const sign = pick===g.home?1:-1;  // factor logit >0 favors home
  const W = g.weather||{};
  const T = {
    mkt_logit: ()=>{ const l=g.line||{}, pm=(l.cur_p_home!=null?l.cur_p_home:g.market.p_home_devig); if(pm==null) return `The betting market leans ${pick}.`; const fav=pm>=.5?g.home:g.away; return `Betting market: ${fav} is favored${l.cur_spread_home!=null?` (${spTxt(l.cur_spread_home,g)})`:''}, about ${pct(Math.max(pm,1-pm))} to win${l.open_spread_home!=null&&l.open_spread_home!==l.cur_spread_home?`; the line opened at ${spTxt(l.open_spread_home,g)}`:''}.`; },
    mkt_spread: ()=>T.mkt_logit(),
    d_ngs_ttt: ()=>`Player tracking: ${pick}'s quarterback gets the ball out in ${P.ngs_ttt?.toFixed(2)}s on average vs ${O.ngs_ttt?.toFixed(2)}s for ${other}.`,
    d_ngs_ryoe: ()=>`Player tracking: ${pick}'s runners gain ${(P.ngs_ryoe>=0?'+':'')+P.ngs_ryoe?.toFixed(2)} yards over expected per carry vs ${(O.ngs_ryoe>=0?'+':'')+O.ngs_ryoe?.toFixed(2)} for ${other}.`,
    d_ngs_sep: ()=>`Player tracking: ${pick}'s receivers get ${P.ngs_sep?.toFixed(2)} yards of separation at the catch point vs ${O.ngs_sep?.toFixed(2)}.`,
    d_ngs_yacoe: ()=>`Player tracking: ${pick} gains ${(P.ngs_yacoe>=0?'+':'')+P.ngs_yacoe?.toFixed(2)} yards after catch over expected vs ${(O.ngs_yacoe>=0?'+':'')+O.ngs_yacoe?.toFixed(2)}.`,
    d_adj_off_off_epa: ()=>`${pick}'s offense has been more efficient: ${f3s(P.adj_off_epa)} vs ${f3s(O.adj_off_epa)} EPA per play, adjusted for opponents.`,
    d_adj_def_off_epa: ()=>`${pick}'s defense has been stingier: opponents average ${f3s(-P.adj_def_epa)} EPA per play against ${pick} vs ${f3s(-O.adj_def_epa)} against ${other}, adjusted for schedule.`,

let ACC = {live:[], bt:[]};
try{ ACC = JSON.parse(document.getElementById('accdata').textContent); }catch(e){ ACC = null; }
if(ACC){ /* full season: live (locked) picks where tracked; walk-forward back-test for weeks before live tracking began */
  const lk = new Set(ACC.live.map(r=>r[0]+'|'+r[1]+'|'+r[2]));
  ACC.live = ACC.live.map(r=>[...r.slice(0,4),'L']); ACC.bt = ACC.bt.map(r=>[...r.slice(0,4),'B']);

const LG_NAME = {nfl:'NFL', college:'College'};
function accState(){
  if(!state.acc){ state.acc = {lg:'all', src:'all', season:null, wk:'all', open:true};
    try{ const s=JSON.parse(localStorage.getItem('gl.acc')||'null'); if(s){ if(!s.v2){ delete s.src; delete s.wk; } Object.assign(state.acc, s); } }catch(e){} state.acc.v2=1; }
  return state.acc;

function accTally(rows){ let w=0,l=0,t=0; rows.forEach(r=>{ if(r[3]===1) w++; else if(r[3]===0) l++; else t++; }); return {w,l,t,n:w+l,p:(w+l)?w/(w+l):null}; }
function accDash(){
  if(!ACC) return '';
  const a = accState(), all = ACC[a.src]||[];
  const seasons = [...new Set(all.map(r=>r[1]))].sort((x,y)=>y-x);
  if(!seasons.includes(a.season)) a.season = seasons[0] ?? null;
  const inSeason = all.filter(r=>r[1]===a.season);
  const byLg = inSeason.filter(r=>a.lg==='all'||r[0]===a.lg);
  const weeks = [...new Set(byLg.map(r=>r[2]))].sort((x,y)=>x-y);
  if(a.wk!=='all' && !weeks.includes(+a.wk)) a.wk='all';
  const wkOk = r => a.wk==='all' || r[2]===+a.wk;
  const rows = byLg.filter(wkOk), T = accTally(rows);
  const lgT = k => accTally(inSeason.filter(r=>r[0]===k && wkOk(r)));
  const P = x => x==null ? '—' : (100*x).toFixed(1)+'%';
  const opt = (v,l,cur) => `<option value="${v}" ${String(v)===String(cur)?'selected':''}>${l}</option>`;
  const lgTile = k => { const t=lgT(k), off = a.lg!=='all' && a.lg!==k;
    return `<div class="tile${off?' off':''}"><div class="k">${LG_NAME[k]} accuracy</div><div class="v">${off?'—':P(t.p)}</div><div class="s">${off?'filtered out':`${t.w}–${t.l}${t.t?` · ${t.t} tie${t.t>1?'s':''} excluded`:''}`}</div></div>`; };
  const lgs = a.lg==='all' ? ['nfl','college'] : [a.lg];
  const tr = []; lgs.forEach(k=>{ [...new Set(byLg.filter(r=>r[0]===k).map(r=>r[2]))].sort((x,y)=>x-y).forEach(w=>{ const rr=byLg.filter(r=>r[0]===k&&r[2]===w), t=accTally(rr); t.bt = a.src==='all' && rr.length && rr.every(r=>r[4]==='B'); if(t.n) tr.push([k,w,t]); }); });

  const comboNote = () => (a.lg==='all'?['nfl','college']:[a.lg]).map(k=>{ const f=firstLive(k); return f==null?`${LG_NAME[k]}: all back-test`:(f>1?`${LG_NAME[k]}: weeks 1–${f-1} back-test (BT), week ${f} on live`:`${LG_NAME[k]}: all live`); }).join(' · ');
  const srcNote = a.src==='all'
    ? `Full season: live picks (locked before kickoff) for every week they were tracked; earlier weeks use the back-test, where each game was predicted by the same model trained only on games before that week. ${comboNote()}.`
    : a.src==='live'
    ? 'Live picks: the model’s pick as locked before kickoff, graded once when the game went final. Earlier predictions are never recalculated.'
    : 'Back-test: each game was predicted by a model trained only on games before that week (walk-forward). Not picks published at the time.';
  const head = T.n ? `${T.w}–${T.l} · ${P(T.p)}` : 'no completed games yet';
  return `<details class="accdash" id="accdash" ${a.open?'open':''}><summary><h2>Model accuracy</h2><span class="head">${head}</span></summary>
  <div class="accf">
    <label>League<select id="accLg">${opt('all','All',a.lg)}${opt('nfl','NFL',a.lg)}${opt('college','College',a.lg)}</select></label>
    <label>Picks<select id="accSrc">${opt('all','Full season',a.src)}${opt('live','Live only',a.src)}${opt('bt','Back-test only',a.src)}</select></label>
    <label>Season<select id="accSeason">${seasons.length?seasons.map(s=>opt(s,s,a.season)).join(''):opt('', '—', '')}</select></label>
    <label>Week<select id="accWk">${opt('all','All',a.wk)}${weeks.map(w=>{ const k=byLg.filter(r=>r[2]===w), b=k.filter(r=>r[4]==='B').length; return opt(w,'Week '+w+(a.src==='all'&&b?(b===k.length?' · back-test':' · part back-test'):''),a.wk); }).join('')}</select></label>
  </div>
  ${T.n ? `<div class="acct">
    <div class="tile big"><div><div class="k">Overall accuracy</div><div class="v">${P(T.p)}</div></div><div class="s">${T.n} completed pick${T.n===1?'':'s'}${a.lg==='all'?' · NFL + College':' · '+LG_NAME[a.lg]}${a.wk==='all'?'':' · Week '+a.wk} · ${a.season}</div></div>
    <div class="tile"><div class="k">Correct picks</div><div class="v">✅ ${T.w}</div></div>

    ${lgTile('nfl')}${lgTile('college')}

  <p class="accnote">Accuracy = correct picks ÷ completed picks × 100. Upcoming and in-progress games are not counted; ties${T.t?` (${T.t} here)`:''} and canceled games are excluded.${a.lg==='all'&&a.wk!=='all'?' Week numbers follow each league’s own schedule.':''} ${srcNote}</p></details>`;
}

}

function row(label, hv, av, fmt, higherBetter){
  if((hv==null||hv===undefined)&&(av==null||av===undefined)) return '';

  return `<tr><td>${label}</td><td class="${hb===false?'better':''}">${fmt(av)}</td><td class="${hb===true?'better':''}">${fmt(hv)}</td></tr>`;
}

/* ---------- Results (walk-forward) ---------- */
function renderResults(){
  const el = $('#tab-results');
  const seasons = [...new Set(B.history.map(h=>h.season))].sort((a,b)=>b-a);
  const sel = state.rs ?? seasons[0];
  const rows = B.history.filter(h=>h.season===sel);
  const weeks = [...new Set(rows.map(r=>r.week))].sort((a,b)=>b-a);
  const decided = rows.filter(r=>r.home_win!==0.5);
  const acc = decided.filter(r=>(r.p_home>0.5)===(r.home_win===1)).length;
  const brier = rows.reduce((s,r)=>s+(r.p_home-r.home_win)**2,0)/rows.length;
  const mk = decided.filter(r=>r.mkt!=null); const macc = mk.filter(r=>(r.mkt>0.5)===(r.home_win===1)).length;
  let html = `<div class="sel"><label for="rs">Season</label><select id="rs">${seasons.map(s=>`<option ${s===sel?'selected':''}>${s}</option>`).join('')}</select>
    <span class="mono muted">Each game was predicted by a model trained only on games before that week (walk-forward).</span></div>
    <div class="tiles"><div class="tile"><div class="k">Model record</div><div class="v">${acc}–${decided.length-acc}</div><div class="s">${pct(acc/decided.length)} winners</div></div>
    <div class="tile"><div class="k">Brier score</div><div class="v">${brier.toFixed(4)}</div><div class="s">lower is better; 0.25 = coin flip</div></div>
    <div class="tile"><div class="k">Market favorite</div><div class="v">${mk.length?pct(macc/mk.length):'—'}</div><div class="s">closing-line benchmark</div></div>
    ${(()=>{const a=atsRecord(rows); return a.w+a.l?`<div class="tile"><div class="k">Against the spread</div><div class="v">${a.w}–${a.l}</div><div class="s">${pct(a.w/(a.w+a.l))} model · favorite ${pct(a.fw/(a.fw+a.fl))}</div></div>`:''})()}
    ${(()=>{const o=ouRecord(rows); return o.n?`<div class="tile"><div class="k">Over/under</div><div class="v">${o.w}–${o.l}</div><div class="s">${pct(o.w/o.n)} model side · overs hit ${pct(o.o/o.n)}</div></div>`:''})()}
    ${sel===seasons[0]?clvTiles():''}
    <div class="tile"><div class="k">Home team</div><div class="v">${pct(decided.filter(r=>r.home_win===1).length/decided.length)}</div><div class="s">always-pick-home</div></div></div>`;
  weeks.forEach(w=>{
    const wr = rows.filter(r=>r.week===w);
    const wa = wr.filter(r=>r.home_win!==0.5&&(r.p_home>0.5)===(r.home_win===1)).length;
    html += `<div class="day">Week ${w} · ${wa}–${wr.filter(r=>r.home_win!==0.5).length-wa}</div>`;
    wr.forEach(r=>{
      const pick = r.p_home>=0.5?r.home:r.away, conf = Math.max(r.p_home,1-r.p_home);
      const won = r.home_win===0.5?'tie':(((r.p_home>0.5)===(r.home_win===1))?'ok':'miss');
      html += `<div class="res" data-teams="${esc(teamKey(r.home,r.away))}"><span class="${won}">${won==='ok'?'✓':won==='miss'?'✗':'='}</span><span>${r.away} ${r.away_score} at ${r.home} ${r.home_score}${atsMark(r)}${ouMark(r)}${r.pred_home!=null?` <span class="muted mono">(proj ${r.pred_away}–${r.pred_home})</span>`:''}</span><span class="mono">${pick} ${pct(conf)}</span><span class="mono muted">${r.mkt!=null?'mkt '+(r.mkt>=0.5?r.home:r.away)+' '+pct(Math.max(r.mkt,1-r.mkt)):''}</span></div>`;
    });
  });
  el.innerHTML = html;
  $('#rs').addEventListener('change', e=>{ state.rs=+e.target.value; renderResults(); });
}

/* ---------- Model performance ---------- */
function calChart(cal){
  const W=360,H=260,m={l:40,r:10,t:10,b:36}; const x=v=>m.l+v*(W-m.l-m.r), y=v=>H-m.b-v*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;display:block" role="img" aria-label="Calibration: predicted vs actual home win rate">`;
  [0,.25,.5,.75,1].forEach(v=>{ s+=`<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text><text x="${x(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text>`; });
  s+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const maxn=Math.max(...cal.map(c=>c.n));
  cal.forEach(c=>{ const r=4+8*Math.sqrt(c.n/maxn); s+=`<circle cx="${x(c.pred)}" cy="${y(c.actual)}" r="${r}" fill="var(--accent)" fill-opacity=".75" stroke="var(--accent)"/>`; });
  s+=`<text x="${(x(0)+x(1))/2}" y="${H-4}" text-anchor="middle">predicted home win probability</text><text transform="rotate(-90)" x="${-(y(0)+y(1))/2}" y="12" text-anchor="middle">actual home win rate</text></svg>`;
  return s;
}

    <div class="panel tscroll"><table><thead><tr><th>Predicted</th><th>Games</th><th>Avg pred</th><th>Actual</th></tr></thead><tbody>
      ${e.calibration.map(c=>`<tr><td>${c.lo.toFixed(1)}–${c.hi.toFixed(1)}</td><td>${c.n}</td><td>${pct(c.pred)}</td><td>${pct(c.actual)}</td></tr>`).join('')}</tbody></table></div></div>
    <h2>By season</h2>
    <div class="tscroll"><table><thead><tr><th>Season</th><th>Games</th><th>Model</th><th>Brier</th><th>Market</th></tr></thead><tbody>
      ${Object.entries(e.by_season).map(([s,v])=>`<tr><td>${s}</td><td>${v.n}</td><td>${pct(v.accuracy)}</td><td>${v.brier.toFixed(4)}</td><td>${pct(v.market_accuracy)}</td></tr>`).join('')}</tbody></table></div>
    <h2>Does each feature group help? (ablation, 2022–${B.season})</h2>
    <p>Starting from the simple baseline, each group was added on its own with the same walk-forward protocol (C = 0.1 here; the final model uses C = 0.02 chosen on 2024). Differences of a few tenths of a percent are within noise.</p>
    <div class="tscroll"><table><thead><tr><th>Feature set</th><th>Features</th><th>Accuracy</th><th>Brier</th><th>Log loss</th></tr></thead><tbody>
      ${abl.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n_features}</td><td>${pct(v.accuracy)}</td><td>${v.brier.toFixed(4)}</td><td>${v.logloss.toFixed(4)}</td></tr>`).join('')}</tbody></table></div>
    ${B.coefficients.crunch?`<h2>Learned weights (final model: stats + betting line)</h2><div class="tscroll"><table><thead><tr><th>Feature</th><th>Weight</th></tr></thead><tbody>${Object.entries(B.coefficients.crunch).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`<tr><td>${esc(B.feature_labels[k]||k)}</td><td>${f3(v)}</td></tr>`).join('')}</tbody></table></div>`:''}
    <h2>Learned weights (stats-only model)</h2>
    <p>Logistic-regression coefficients on standardized home-minus-away differences. Positive favors the home team when it has the higher value.</p>
    <div class="tscroll"><table><thead><tr><th>Feature</th><th>Weight</th></tr></thead><tbody>
      ${Object.entries(B.coefficients.early).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`<tr><td>${esc(B.feature_labels[k]||k)}</td><td>${f3(v)}</td></tr>`).join('')}</tbody></table></div>`;
}
